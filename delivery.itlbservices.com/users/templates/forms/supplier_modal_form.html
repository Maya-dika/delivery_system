<form method="post" hx-post="{% url 'users:create_supplier_modal' %}" hx-target="#modal-content-placeholder" hx-swap="innerHTML">
    {% csrf_token %}
    <div class="modal-header">
      <h5 class="modal-title">Create Merchant</h5>
      <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <div class="modal-body">
      {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
      {% endif %}
      <div class="row">
        <div class="col-md-6">
          <label for="name">Name</label>
          <input class="form-control" id="supplier-name" name="name" value="{{ form_data.name|default:'' }}" required>
        </div>
        <div class="col-md-6">
          <label for="email">Email</label>
          <input class="form-control" id="supplier-email" name="email" value="{{ form_data.email|default:'' }}">
        </div>
      </div>
      <div class="row mt-2">
        <div class="col-md-6">
          <label for="phone">Phone</label>
          <input class="form-control" id="supplier-phone" name="phone_number" value="{{ form_data.phone_number|default:'' }}" required>
        </div>
        <div class="col-md-6">
          <label for="domain">Domain Description</label>
          <input class="form-control" id="supplier-domain" name="domain_description" value="{{ form_data.domain_description|default:'' }}">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <label for="domain">Warehouse</label>
          <select id="supplier-warehouse" name="warehouse" class="form-select" required>
            <option value="">-- Select Warehouse --</option>
            {% for wh in warehouses %}
              <option value="{{ wh.id }}" {% if form_data.warehouse == wh.id|stringformat:'s' %}selected{% endif %}>{{ wh.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <hr/>
      <h6>Accounts</h6>
      <div class="row mt-2">
        <div class="col-md-12">
          <label for="account">Accounts (Optional - Hold Ctrl/Cmd to select multiple)</label>
          <select id="supplier-account" name="account" class="form-select" multiple size="5">
            {% for account in accounts %}
              <option value="{{ account.id }}" {% if form_data.account and account.id|stringformat:'s' in form_data.account %}selected{% endif %}>
                {{ account.name }} 
                {% if account.currency %}- {{ account.currency.code }}{% endif %}
                {% if account.parent %} ({{ account.parent.name }}){% endif %}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
      <hr/>
      <h6>
        <div class="custom-control custom-switch">
          <input type="checkbox" class="custom-control-input" id="toggle-user" name="create_user" {% if form_data.create_user %}checked{% endif %}
             hx-on:change="document.getElementById('supplier-user').classList.toggle('d-none', !this.checked)">
          <label class="custom-control-label" for="toggle-user">Register a user account for this client</label>
        </div>
      </h6>
      <div class="row {% if not form_data.create_user %}d-none{% endif %}" id="supplier-user">
          <div class="col-md-6">
            <label for="domain">Username</label>
            <input class="form-control" id="supplier-username" name="username" value="{{ form_data.username|default:'' }}">
          </div>
          <div class="col-md-6">
            <label for="domain">Password</label>
            <input class="form-control" id="supplier-password" name="password">
          </div>
      </div>

      <hr/>
      <label>
        Address
      </label>
      <div class="row">
        <div class="col-md-6">
          <label for="domain">Country</label>
          <select id="supplier-country" name="country" class="form-select" required>
            <option value="">-- Select Country --</option>
            {% for code, name in countries %}
              <option value="{{ code }}" {% if form_data.country == code %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label for="domain">City</label>
          <input class="form-control" id="address-city" name="city" value="{{ form_data.city|default:'' }}">
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <label for="domain">Street</label>
          <input class="form-control" id="address-street" name="street" value="{{ form_data.street|default:'' }}">
        </div>
        <div class="col-md-3">
          <label for="domain">Building</label>
          <input class="form-control" id="address-building" name="building" value="{{ form_data.building|default:'' }}">
        </div>
        <div class="col-md-3">
          <label for="domain">Zip Code</label>
          <input class="form-control" id="address-zip_code" name="zip_code" value="{{ form_data.zip_code|default:'' }}">
        </div>
      </div>

      <hr/>

    </div>
    <div class="modal-footer">
      <button type="submit" class="btn btn-success">Save</button>
    </div>
</form>
