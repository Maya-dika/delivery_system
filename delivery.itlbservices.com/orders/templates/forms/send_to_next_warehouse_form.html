<div class="modal-header">
    <h5 class="modal-title" id="sendToNextWarehouseModalLabel">Send to Next Warehouse</h5>
    <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <form id="send-to-next-warehouse-form" method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">From Warehouse (User's Warehouse)</label>
        <select name="from_warehouse" id="from_warehouse" class="form-select" disabled>
          <option value="">Select source warehouse</option>
          {% for wh in warehouses %}
            <option value="{{ wh.id }}" {% if employee and employee.warehouse and employee.warehouse.id == wh.id %}selected{% endif %}>{{ wh.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">To Warehouse</label>
        <select name="target_warehouse" id="target_warehouse" class="form-select">
          <option value="">Select destination warehouse</option>
          {% for wh in warehouses %}
            <option value="{{ wh.id }}">{{ wh.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label for="driver" class="form-label">Driver</label>
        <select name="driver_id" id="driver" class="form-select">
          <option value="">Select a driver</option>
          {% for driver in drivers %}
            <option value="{{ driver.id }}">{{ driver.name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
  </div>
